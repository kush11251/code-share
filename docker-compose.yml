services:
  app:
    build: .
    ports:
      - '8080:8080'
    depends_on:
      - redis
    environment:
      - REDIS_ADDR=redis:6379
    volumes:
      - ./:/app

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ["redis-server", "--save", "", "--appendonly", "no"]
